name: Deploy to Firebase Hosting
on:
  push:
    branches: [ main ]
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps && npm run build
      - name: Validate Service Account & Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          trap 'rm -f "$SA_FILE"' EXIT
          node -e '
            const fs = require("node:fs");
            let raw = (process.env.FIREBASE_SERVICE_ACCOUNT || "").trim();
            if (!raw) {
              console.error("ERROR: FIREBASE_SERVICE_ACCOUNT secret is empty.");
              process.exit(1);
            }

            const cleanText = (txt) =>
              txt
                .replace(/[\uFEFF\u200B-\u200F\u202A-\u202E]/g, "")
                .replace(/\u00A0/g, " ")
                .replace(/[“”]/g, "\"")
                .replace(/[‘’]/g, "\x27")
                .trim();

            const tryParse = (txt) => {
              const cleaned = cleanText(txt);
              const firstBrace = cleaned.indexOf("{");
              const lastBrace = cleaned.lastIndexOf("}");
              const candidate =
                firstBrace !== -1 && lastBrace > firstBrace
                  ? cleaned.slice(firstBrace, lastBrace + 1)
                  : cleaned;
              try {
                return JSON.parse(candidate);
              } catch (firstErr) {
                // Handle literal unescaped newlines inside JSON string values (common in mobile editors)
                let fixed = "";
                let inStr = false;
                let escaped = false;
                for (let i = 0; i < candidate.length; i++) {
                  const ch = candidate[i];
                  if (escaped) {
                    fixed += ch;
                    escaped = false;
                    continue;
                  }
                  if (ch === "\\" && inStr) {
                    fixed += ch;
                    escaped = true;
                    continue;
                  }
                  if (ch === "\"") {
                    inStr = !inStr;
                    fixed += ch;
                    continue;
                  }
                  if (inStr && (ch === "\n" || ch === "\r")) {
                    if (ch === "\n") fixed += "\\n";
                    continue;
                  }
                  fixed += ch;
                }
                return JSON.parse(fixed);
              }
            };

            let parsed = null;
            let lastErr = null;
            try {
              parsed = tryParse(raw);
            } catch (err) {
              lastErr = err;
              if (/^[A-Za-z0-9+/=\s]+$/.test(raw) && raw.length > 60) {
                try {
                  const decoded = Buffer.from(raw.replace(/\s+/g, ""), "base64").toString("utf8");
                  parsed = tryParse(decoded);
                  lastErr = null;
                } catch (b64Err) {
                  lastErr = b64Err;
                }
              }
            }

            if (!parsed || typeof parsed !== "object") {
              console.error("ERROR: FIREBASE_SERVICE_ACCOUNT is NOT valid Service Account JSON.");
              console.error("Diagnostics:", JSON.stringify({
                length: raw.length,
                startsWithBrace: cleanText(raw).startsWith("{"),
                endsWithBrace: cleanText(raw).endsWith("}"),
                hasServiceAccountWord: raw.includes("service_account"),
                hasPrivateKeyHeader: raw.includes("PRIVATE KEY"),
                hasProjectIdWord: raw.includes("electricity-station-f5a90"),
                parseError: lastErr ? lastErr.message : "unknown"
              }));
              process.exit(1);
            }

            if (parsed.type !== "service_account" || !parsed.private_key || !parsed.client_email) {
              console.error("ERROR: JSON is missing type=service_account, client_email, or private_key. Keys found:", Object.keys(parsed).join(","));
              process.exit(1);
            }
            console.log("Service account project_id:", parsed.project_id, "client_email:", parsed.client_email);
            if (parsed.project_id !== "electricity-station-f5a90") {
              console.error("ERROR: Wrong project_id in FIREBASE_SERVICE_ACCOUNT:", parsed.project_id);
              process.exit(1);
            }
            fs.writeFileSync(process.argv[1], JSON.stringify(parsed), { mode: 0o600 });
          ' "$SA_FILE"
          GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE" npx -y firebase-tools@15 deploy --only hosting --project electricity-station-f5a90 --non-interactive
