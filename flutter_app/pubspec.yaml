name: yemen_power_station
description: >-
  تطبيق إدارة محطات الكهرباء التجارية في اليمن - يدعم العمل أوفلاين بالكامل،
  التعرف الضوئي على قراءات العدادات، استيراد وتصدير إكسل، وبوابة المشترك.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Typography
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Offline-First Local Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5

  # Firebase Cloud Backend & Push Notifications
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1

  # Camera, Image Compression & Offline OCR
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.1
  flutter_image_compress: ^2.3.0

  # Excel Import / Export
  excel: ^4.0.6
  file_picker: ^8.1.2
  share_plus: ^10.0.2

  # SMS & WhatsApp Invoice Launcher
  url_launcher: ^6.3.1
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
